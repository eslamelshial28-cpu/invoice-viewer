<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتح الفاتورة</title>
</head>
<body style="font-family: Arial; text-align: center; padding-top: 50px; background: #f4f6f9;">
    <h3 id="msg">جاري تحويلك إلى الفاتورة...</h3>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id');
        if (invoiceId) {
            window.location.replace("https://script.google.com/macros/s/AKfycbyX8YNRPho_RNQ_lezO6o4lj14WtYrkleyr-_9H_LEvrsQ0IvHRJkl3P-p4UlNFwNB3/exec?id=" + invoiceId);
        } else {
            document.getElementById('msg').innerText = "خطأ: رقم الفاتورة غير موجود.";
        }
    </script>
</body>
</html>
