<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عرض الفاتورة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    main {
      height: calc(100dvh - 55px);
      min-height: 300px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #message { padding: 20px; }
    a { color: #1456b8; }
  </style>
</head>
<body>
  <header>عرض الفاتورة</header>
  <main id="viewer">
    <div id="message">جاري فتح الفاتورة...</div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const source = params.get("url") || "";
    let fileId = "";

    try {
      const u = new URL(source);
      if (u.hostname === "drive.google.com") {
        const match = u.pathname.match(/\/file\/d\/([^/]+)/);
        fileId = match ? match[1] : (u.searchParams.get("id") || "");
      }
    } catch (_) {}

    const viewer = document.getElementById("viewer");

    if (!/^[\w-]+$/.test(fileId)) {
      document.getElementById("message").textContent =
        "رابط الفاتورة غير صالح أو غير مدعوم.";
    } else {
      const frame = document.createElement("iframe");
      frame.title = "معاينة الفاتورة PDF";
      frame.src =
        "https://drive.google.com/file/d/" +
        encodeURIComponent(fileId) + "/preview";
      frame.allow = "autoplay";
      viewer.replaceChildren(frame);
    }
  </script>
</body>
</html>
